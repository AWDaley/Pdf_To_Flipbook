l, sans-serif" font-size="11"  >FROM THE FIELD JOURNAL</text><text x="49" y="154" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="58"  >Small things,</text><text x="49" y="218" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="58" font-style="italic" >closely observed.</text><text x="49" y="737" fill="#203d34" font-family="Arial, sans-serif" font-size="11"  >01   /   THE SHAPE OF A LEAF</text><text x="409" y="737" fill="#203d34" font-family="Arial, sans-serif" font-size="11"  >02   /   A DIFFERENT PACE</text><text x="49" y="779" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="18"  >A whole season of growth</text><text x="49" y="806" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="18"  >held in a single outline.</text><text x="49" y="833" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="18"  >Trace the edge with your eyes.</text><text x="409" y="779" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="18"  >Let curiosity choose</text><text x="409" y="806" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="18"  >where you stop next.</text><text x="409" y="833" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="18"  >Leave room for a detour.</text><text x="49" y="909" fill="#6a7768" font-family="Arial, sans-serif" font-size="10"  >Botanical studies / original vector illustrations</text><text x="48" y="973" fill="#203d34" font-family="Arial, sans-serif" font-size="10"  >FIELDNOTES     /     VOL. 01</text><text x="677" y="975" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="15"  >07</text></svg>