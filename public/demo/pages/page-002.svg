<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1000" viewBox="0 0 750 1000"><rect x="0" y="0" width="750" height="1000" fill="#f2efe5"/><path d="M49 270L700 270" stroke="#203d34" stroke-opacity="0.35" fill="none"/><g transform="translate(592 595) rotate(-17) scale(0.77)" stroke="#6a7768" fill="none" stroke-width="1.2"><path d="M0 330C20 220 -10 130 20 0"/><path d="M9 77Q92 40 74 12Q26 25 9 77Z"/><path d="M9 77L66 23" opacity=".5"/><path d="M9 111Q-92 74 -74 46Q-26 59 9 111Z"/><path d="M9 111L-66 57" opacity=".5"/><path d="M9 145Q92 108 74 80Q26 93 9 145Z"/><path d="M9 145L66 91" opacity=".5"/><path d="M9 179Q-92 142 -74 114Q-26 127 9 179Z"/><path d="M9 179L-66 125" opacity=".5"/><path d="M9 213Q92 176 74 148Q26 161 9 213Z"/><path d="M9 213L66 159" opacity=".5"/><path d="M9 247Q-92 210 -74 182Q-26 195 9 247Z"/><path d="M9 247L-66 193" opacity=".5"/><path d="M9 281Q92 244 74 216Q26 229 9 281Z"/><path d="M9 281L66 227" opacity=".5"/><path d="M9 315Q-92 278 -74 250Q-26 263 9 315Z"/><path d="M9 315L-66 261" opacity=".5"/></g><path d="M48 948L702 948" stroke="#203d34" stroke-opacity="0.35" fill="none"/><text x="48" y="62" fill="#203d34" font-family="Arial, sans-serif" font-size="11"  >A LETTER FROM THE FIELD</text><text x="48" y="164" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="62"  >The art of</text><text x="48" y="234" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="62" font-style="italic" >paying attention.</text><text x="49" y="317" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="21"  >The places that stay with us are often the quietest.</text><text x="49" y="348" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="21"  >A path between trees. The edge of a lake at first light.</text><text x="49" y="379" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="21"  >A room with a window open to the weather.</text><text x="49" y="452" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="16"  >This journal is an invitation to look a little longer.</text><text x="49" y="477" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="16"  >We follow the soft line of a horizon and listen for</text><text x="49" y="502" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="16"  >the spaces between sounds. Nothing here asks</text><text x="49" y="527" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="16"  >to be hurried. There is no perfect route to take.</text><text x="49" y="578" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="16"  >Take these pages as field notes, unfinished and open.</text><text x="49" y="603" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="16"  >Find a place to sit. Notice the changing light.</text><text x="49" y="628" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="16"  >Begin wherever you are.</text><text x="49" y="743" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="20" font-style="italic" >With curiosity,</text><text x="49" y="781" fill="#203d34" font-family="Arial, sans-serif" font-size="16"  >The Fieldnotes studio</text><text x="49" y="889" fill="#6a7768" font-family="Arial, sans-serif" font-size="10"  >Original writing and illustrations. Made for this demo.</text><text x="48" y="973" fill="#203d34" font-family="Arial, sans-serif" font-size="10"  >FIELDNOTES     /     VOL. 01</text><text x="677" y="975" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="15"  >02</text></svg>