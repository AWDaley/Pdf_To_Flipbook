<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1000" viewBox="0 0 750 1000"><rect x="0" y="0" width="750" height="1000" fill="#f2efe5"/><path d="M49 266L700 266" stroke="#203d34" stroke-opacity="0.35" fill="none"/><path d="M101 538L695 538" stroke="#203d34" stroke-opacity="0.15" fill="none"/><path d="M101 609L695 609" stroke="#203d34" stroke-opacity="0.15" fill="none"/><path d="M101 680L695 680" stroke="#203d34" stroke-opacity="0.15" fill="none"/><path d="M101 751L695 751" stroke="#203d34" stroke-opacity="0.15" fill="none"/><path d="M101 822L695 822" stroke="#203d34" stroke-opacity="0.15" fill="none"/><path d="M48 948L702 948" stroke="#203d34" stroke-opacity="0.35" fill="none"/><text x="49" y="61" fill="#203d34" font-family="Arial, sans-serif" font-size="11"  >TAKE SOMETHING WITH YOU</text><text x="49" y="156" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="63"  >Make room</text><text x="49" y="227" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="63" font-style="italic" >for wonder.</text><text x="49" y="318" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="22"  >You do not need a distant horizon</text><text x="49" y="350" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="22"  >to practice paying attention.</text><text x="49" y="382" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="22"  >A familiar street in unfamiliar light</text><text x="49" y="414" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="22"  >can be the start of something.</text><text x="49" y="515" fill="#aa6249" font-family="Arial, sans-serif" font-size="14"  >01</text><text x="101" y="515" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="22"  >Take the longer way home.</text><text x="49" y="586" fill="#aa6249" font-family="Arial, sans-serif" font-size="14"  >02</text><text x="101" y="586" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="22"  >Leave your headphones in your pocket.</text><text x="49" y="657" fill="#aa6249" font-family="Arial, sans-serif" font-size="14"  >03</text><text x="101" y="657" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="22"  >Learn the name of one tree.</text><text x="49" y="728" fill="#aa6249" font-family="Arial, sans-serif" font-size="14"  >04</text><text x="101" y="728" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="22"  >Sit still for five unhurried minutes.</text><text x="49" y="799" fill="#aa6249" font-family="Arial, sans-serif" font-size="14"  >05</text><text x="101" y="799" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="22"  >Write down what you notice.</text><text x="49" y="910" fill="#aa6249" font-family="Georgia, Times New Roman, serif" font-size="18" font-style="italic" >Begin again tomorrow.</text><text x="48" y="973" fill="#203d34" font-family="Arial, sans-serif" font-size="10"  >FIELDNOTES     /     VOL. 01</text><text x="677" y="975" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="15"  >09</text></svg>