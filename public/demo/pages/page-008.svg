<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1000" viewBox="0 0 750 1000"><rect x="0" y="0" width="750" height="1000" fill="#cfac8c"/><svg x="0" y="210" width="750" height="440" viewBox="0 0 750 440"><rect width="750" height="440" fill="#a7ad91"/><path d="M0 280L180 130L280 250L450 105L690 300L750 230V440H0Z" fill="#74876a"/><path d="M0 360L750 290V440H0Z" fill="#5b7457"/><path d="M195 177L454 127L580 211L320 269Z" fill="#5c5744"/><path d="M205 183L320 267V416L205 320Z" fill="#b8865d"/><path d="M320 267L572 212V353L320 416Z" fill="#c5976e"/><path d="M364 283L491 254V347L364 380Z" fill="#344d41"/><path d="M370 289L428 276V358L370 373Z" fill="#b6c2a8"/><path d="M436 274L483 264V345L436 357Z" fill="#d4c9a8"/><path d="M211 198L303 265" stroke="#ead8b4"/><path d="M217 212V315M229 221V326M241 230V338M253 239V349M265 248V361M277 257V372M289 266V384" stroke="#9e704f"/><path d="M570 356L681 440H305L325 414Z" fill="#d1b58a"/></svg><path d="M48 948L702 948" stroke="#203d34" stroke-opacity="0.35" fill="none"/><text x="49" y="61" fill="#203d34" font-family="Arial, sans-serif" font-size="11"  >03    /    THE SHELTER</text><text x="49" y="155" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="59"  >A place to pause.</text><text x="49" y="693" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="29" font-style="italic" >Not a destination. A way of being.</text><text x="49" y="753" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="20"  >A small shelter, a generous window, the sound of rain.</text><text x="49" y="783" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="20"  >Enough space to put the day down and pick up a book.</text><text x="49" y="813" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="20"  >The best rooms leave some room for the world outside.</text><text x="49" y="901" fill="#203d34" font-family="Arial, sans-serif" font-size="10"  >Fig. 03   /   A imagined forest cabin. Original architectural illustration.</text><text x="48" y="973" fill="#203d34" font-family="Arial, sans-serif" font-size="10"  >FIELDNOTES     /     VOL. 01</text><text x="677" y="975" fill="#203d34" font-family="Georgia, Times New Roman, serif" font-size="15"  >08</text></svg>